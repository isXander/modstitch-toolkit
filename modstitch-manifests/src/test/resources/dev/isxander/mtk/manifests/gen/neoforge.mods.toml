[[features.example]]
javaVersion = "[21,)"

[[modproperties.example]]
catalogueItemIcon = "example:item"

[[dependencies.example]]
modId = "minecraft"
type = "required"
versionRange = "[1.20,1.21)"

[[dependencies.example]]
modId = "client_only"
type = "optional"
versionRange = "[1.0,)"
side = "CLIENT"
