modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT AND Apache-2.0"
showAsResourcePack = true
services = ["example.Service"]
issueTrackerURL = "https://example.test/issues"

[properties]
catalogueImageIcon = "assets/example/icon.png"

[[mods]]
modId = "example"
namespace = "example_ns"
version = "1.2.3"
displayName = "Example Mod"
description = "Does useful things"
logoFile = "assets/example/icon.png"
