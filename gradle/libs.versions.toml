[versions]
kotlin-dsl = "6.5.7"
plugin-publish = "2.1.1"
fabric-loom = "1.17.0-alpha.12"
mod-dev-gradle = "2.0.141"
neogradle = "7.1.27"
jackson = "3.1.3"
junit-jupiter = "5.13.4"
junit-platform = "1.13.4"

[plugins]
kotlin-dsl = { id = "org.gradle.kotlin.kotlin-dsl", version.ref = "kotlin-dsl" }
plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "plugin-publish" }
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
mod-dev-gradle = { id = "net.neoforged.moddev", version.ref = "mod-dev-gradle" }
neogradle = { id = "net.neoforged.gradle.userdev", version.ref = "neogradle" }

[libraries]
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-dataformat-toml = { module = "tools.jackson.dataformat:jackson-dataformat-toml", version.ref = "jackson" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
